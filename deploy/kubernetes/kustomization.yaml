# DNA Sample Manager — déploiement Kubernetes (kustomize), adapté aux clusters de
# l'Institut Pasteur (k8sprod-02 / k8sdev-01). Voir KUBERNETES.md.
#   kubectl apply -k deploy/kubernetes/
#
# À ADAPTER :
#   - namespace   (ci-dessous : nom attribué par la DSI, convention <projet>-prod / <projet>-dev)
#   - image       (ci-dessous : registre GitLab Pasteur ou Harbor + version ; idem maintenance.yaml)
#   - host        (ingress.yaml : <nom>.pasteur.cloud en prod, <nom>.dev.pasteur.cloud en dev)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dna-sample-manager-prod

labels:
  - pairs:
      app.kubernetes.io/name: dna-sample-manager
    includeSelectors: true

resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # networkpolicy.yaml : inutile à Pasteur (namespaces isolés par la plateforme) ;
  # à ajouter sur un cluster sans isolation, en adaptant le namespace du contrôleur Ingress.

images:
  - name: dna-sample-manager
    newName: registry-gitlab.pasteur.fr/GROUPE/dna-sample-manager
    newTag: "0.1.0"
