# Stockage Institut Pasteur (voir KUBERNETES.md) :
#   ceph-block : ReadWriteOnce, classe par défaut, recommandée pour les bases de données
#   ceph-fs    : ReadWriteMany (partagé) — À NE PAS utiliser pour la base SQLite
#                (système de fichiers réseau : verrous SQLite peu fiables)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dna-sample-manager-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 2Gi          # base actuelle : ~8 Mo ; agrandissable plus tard
---
# Sauvegardes : même stockage Ceph que la base (le cluster n'en propose pas d'autre).
# Elles protègent contre les erreurs et la corruption, PAS contre une panne du stockage :
# garder une copie hors du cluster (voir « Sauvegardes » dans KUBERNETES.md).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dna-sample-manager-backups
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-block
  resources:
    requests:
      storage: 5Gi          # 30 sauvegardes x ~8 Mo, avec beaucoup de marge
