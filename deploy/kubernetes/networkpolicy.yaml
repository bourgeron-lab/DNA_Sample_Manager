# Seul le contrôleur Ingress peut joindre l'app (l'app fait confiance aux en-têtes
# X-Forwarded-* qu'il envoie). Sans effet si le réseau du cluster n'applique pas les
# NetworkPolicy — à vérifier auprès des administrateurs du cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dna-sample-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dna-sample-manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              # Namespace du contrôleur Ingress : ingress-nginx, traefik, kube-system (k3s)...
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: http
