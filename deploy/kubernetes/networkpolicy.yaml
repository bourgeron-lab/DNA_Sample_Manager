# FACULTATIF — non inclus dans kustomization.yaml. Sur les clusters de l'Institut Pasteur,
# la plateforme isole déjà les namespaces. Sur un autre cluster : n'autoriser que le
# contrôleur Ingress à joindre l'app (elle fait confiance à ses en-têtes X-Forwarded-*).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dna-sample-manager
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dna-sample-manager
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              # Namespace du contrôleur Ingress : traefik, ingress-nginx, kube-system (k3s)...
              kubernetes.io/metadata.name: traefik
      ports:
        - port: http
