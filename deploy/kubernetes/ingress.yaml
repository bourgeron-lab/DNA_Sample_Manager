# Ingress Institut Pasteur : contrôleur Traefik (ingress-nginx retiré en mars 2026).
#   - classe « internal » : accessible depuis le réseau Pasteur uniquement (base de données
#     de sujets : NE PAS utiliser « external », qui publie l'app sur internet)
#   - nom d'hôte dans le domaine du cluster : *.pasteur.cloud (k8sprod-02),
#     *.dev.pasteur.cloud (k8sdev-01). Certificat HTTPS fourni automatiquement.
#   - les annotations nginx.ingress.kubernetes.io/* sont ignorées par Traefik
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dna-sample-manager
spec:
  ingressClassName: internal
  rules:
    - host: dna-sample-manager.pasteur.cloud
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: dna-sample-manager
                port:
                  name: http
