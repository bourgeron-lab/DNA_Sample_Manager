# nginx — reverse proxy HTTPS devant DNA Sample Manager
#   sudo cp deploy/nginx-dna-sample-manager.conf /etc/nginx/sites-available/dna-sample-manager
#   sudo ln -s /etc/nginx/sites-available/dna-sample-manager /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# À adapter : server_name (2 fois) et les chemins du certificat (fourni par la DSI).

server {
    listen 80;
    listen [::]:80;
    server_name adn.example.pasteur.fr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name adn.example.pasteur.fr;

    ssl_certificate     /etc/ssl/certs/dna-sample-manager.crt;
    ssl_certificate_key /etc/ssl/private/dna-sample-manager.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # En-têtes de sécurité. Referrer-Policy : surtout pas « no-referrer », la protection CSRF
    # de l'app vérifie en HTTPS que l'en-tête Referer vient du même site.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 10m;

    access_log /var/log/nginx/dna-sample-manager.access.log;
    error_log  /var/log/nginx/dna-sample-manager.error.log;

    location / {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Remplace (n'ajoute pas) : l'app ne fait confiance qu'à un seul niveau de proxy
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_read_timeout 300s;   # exports Excel volumineux
    }
}
